<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toyota 折讓查詢</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 14px 40px}.hero{background:#fff;border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:0 5px 24px #0000000d}.brand{font-size:13px;font-weight:800;letter-spacing:1.4px;color:#d71920}.hero h1{font-size:26px;margin:5px 0 4px}.hero p{font-size:14px;color:#6e6e73;margin:0}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 24px #0000000d}.field{margin:0 0 14px}.field:last-child{margin:0}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#555}select{width:100%;font:inherit;font-size:17px;border:1px solid #d2d2d7;border-radius:12px;padding:12px 13px;background:#fff;color:#111}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid #eee}.row:last-child{border:0}.name{font-size:14px;color:#555}.value{font-size:17px;font-weight:700;text-align:right}.deal{background:#1d1d1f;color:white}.deal .row{border-color:#3a3a3c}.deal .name{color:#d1d1d6}.deal .value{font-size:19px}.deal .row:last-child .value{font-size:22px}.note{background:#fff7e6;border:1px solid #f2d19a;border-radius:14px;padding:13px 14px;margin-top:12px;font-size:14px;line-height:1.5}.note b{display:block;margin-bottom:3px}.muted{font-size:12px;color:#86868b;text-align:center;margin-top:16px}.hidden{display:none}
</style></head>
<body><div class="wrap">
<div class="hero"><div class="brand">TOYOTA</div><h1>全車系折讓查詢</h1><p>選擇車型與版本，自動計算成交價</p></div>
<div class="card">
<div class="field"><label>車型</label><select id="model"></select></div>
<div class="field"><label>年式</label><select id="year"><option>2026出廠</option></select></div>
<div class="field"><label>版本</label><select id="trim"></select></div>
<div class="field"><label>投保乙式</label><select id="insurance"><option value="有">有</option><option value="無">無</option></select></div>
</div>
<div class="card">
<div class="row"><span class="name">車輛總價</span><span class="value" id="price"></span></div>
<div class="row"><span class="name">空車折讓</span><span class="value" id="base"></span></div>
<div class="row"><span class="name">精裝折讓（獎金）</span><span class="value" id="premium"></span></div>
<div class="row"><span class="name">影音折讓（獎金）</span><span class="value" id="av"></span></div>
<div class="row"><span class="name">可折讓獎金</span><span class="value" id="total"></span></div>
</div>
<div class="card deal">
<div class="row"><span class="name">空車成交價</span><span class="value" id="deal1"></span></div>
<div class="row"><span class="name">空車＋精裝成交價</span><span class="value" id="deal2"></span></div>
<div class="row"><span class="name">空車＋精裝＋影音成交價</span><span class="value" id="deal3"></span></div>
</div>
<div class="note" id="note"><b>備註</b><span id="noteText"></span></div>
<div class="muted">無投保乙式時，減發金額僅反映於成交價，不更動原折讓顯示。</div>
</div>
<script>
const data=[
{model:'RAV4 HEV',trim:'豪華',price:1040000,base:58000,premium:34000,av:27000,note:'無',noIns:8000},
{model:'RAV4 HEV',trim:'尊爵',price:1170000,base:58000,premium:34000,av:27000,note:'無',noIns:8000},
{model:'RAV4 HEV',trim:'尊爵＋',price:1220000,base:58000,premium:34000,av:27000,note:'無',noIns:8000},
{model:'RAV4 HEV',trim:'旗艦',price:1300000,base:78000,premium:34000,av:27000,note:'無',noIns:8000},
{model:'RAV4 HEV',trim:'Adventure',price:1330000,base:58000,premium:34000,av:27000,note:'無',noIns:8000},
{model:'RAV4 HEV',trim:'GR-S',price:1390000,base:51000,premium:34000,av:27000,note:'贈送璨晶鍍膜',noIns:8000},
{model:'RAV4 HEV',trim:'PHEV',price:1490000,base:10000,premium:0,av:27000,note:'無',noIns:8000}
];
const $=id=>document.getElementById(id), fmt=n=>'NT$ '+n.toLocaleString('zh-TW');
const model=$('model'),trim=$('trim'),ins=$('insurance');
function fillModels(){[...new Set(data.map(x=>x.model))].forEach(x=>model.add(new Option(x,x)));fillTrims()}
function fillTrims(){const old=trim.value;trim.innerHTML='';data.filter(x=>x.model===model.value).forEach(x=>trim.add(new Option(x.trim,x.trim)));if([...trim.options].some(o=>o.value===old))trim.value=old;render()}
function render(){const d=data.find(x=>x.model===model.value&&x.trim===trim.value);if(!d)return;const add=ins.value==='無'?d.noIns:0;$('price').textContent=fmt(d.price);$('base').textContent=fmt(d.base);$('premium').textContent=fmt(d.premium);$('av').textContent=fmt(d.av);$('total').textContent=fmt(d.base+d.premium+d.av);$('deal1').textContent=fmt(d.price-d.base+add);$('deal2').textContent=fmt(d.price-d.base-d.premium+add);$('deal3').textContent=fmt(d.price-d.base-d.premium-d.av+add);$('noteText').textContent=d.note==='無'?'無':d.note;$('note').classList.toggle('hidden',d.note==='無')}
model.addEventListener('change',fillTrims);trim.addEventListener('change',render);ins.addEventListener('change',render);fillModels();
</script></body></html>
