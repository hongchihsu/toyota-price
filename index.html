<!doctype html>
<html lang="zh-Hant">

<title>Toyota 折讓查詢</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f5f5f7;color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif
}
.wrap{max-width:560px;margin:auto;padding:18px 14px 40px}
.hero,.card{
  background:#fff;border-radius:20px;
  box-shadow:0 5px 24px #0000000d
}
.hero{padding:20px 18px;margin-bottom:14px}
.brand{font-size:13px;font-weight:800;letter-spacing:1.4px;color:#d71920}
.hero h1{font-size:26px;margin:5px 0 4px}
.hero p{font-size:14px;color:#6e6e73;margin:0}
.card{padding:16px;margin:12px 0}
.field{margin:0 0 14px}
.field:last-child{margin:0}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#555}
select{
  width:100%;font:inherit;font-size:17px;
  border:1px solid #d2d2d7;border-radius:12px;
  padding:12px 13px;background:#fff;color:#111
}
.row{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:11px 2px;border-bottom:1px solid #eee
}
.row:last-child{border:0}
.name{font-size:14px;color:#555}
.value{font-size:17px;font-weight:700;text-align:right}
.deal{background:#1d1d1f;color:#fff}
.deal .name{color:#d1d1d6}
.deal .value{font-size:22px}
.note{
  background:#fff7e6;border:1px solid #f2d19a;
  border-radius:14px;padding:13px 14px;margin-top:12px;
  font-size:14px;line-height:1.5
}
.note b{display:block;margin-bottom:3px}
.muted{font-size:12px;color:#86868b;text-align:center;margin-top:16px}
.hidden{display:none!important}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
  <div class="brand">TOYOTA</div>
  <h1>全車系折讓查詢</h1>
  <p>選擇車型、年式與報價方式，自動計算成交價</p>
</div>

<div class="card">

  <div class="field">
    <label>車型</label>
    <select id="model"></select>
  </div>

  <div class="field">
    <label>年式</label>
    <select id="year"></select>
  </div>

  <div class="field">
    <label>版本</label>
    <select id="trim"></select>
  </div>

  <div class="field">
    <label>投保乙式</label>
    <select id="insurance">
      <option value="有">有</option>
      <option value="無">無</option>
    </select>
  </div>

  <div class="field">
    <label>報價方式</label>
    <select id="quote"></select>
  </div>

</div>


<div class="card">

  <div class="row">
    <span class="name" id="selectedPriceName"></span>
    <span class="value" id="selectedPrice"></span>
  </div>

  <div class="row">
    <span class="name" id="selectedBonusName"></span>
    <span class="value" id="selectedBonus"></span>
  </div>

</div>


<div class="card deal">
  <div class="row">
    <span class="name" id="dealName">成交價</span>
    <span class="value" id="deal"></span>
  </div>
</div>


<div class="note" id="note">
  <b>備註</b>
  <span id="noteText"></span>
</div>

<div class="muted">
未投保乙式時，加回減發金額至成交／成本價，獎金顯示不變。
</div>

</div>

const $=id=>document.getElementById(id);
const fmt=n=>'NT$ '+n.toLocaleString('zh-TW');

const model=$('model');
const year=$('year');
const trim=$('trim');
const ins=$('insurance');
const quote=$('quote');


function current(){
  return data.find(x=>
    x.model===model.value &&
    x.year===year.value &&
    x.trim===trim.value
  );
}


function fillModels(){

  model.innerHTML='';

  [...new Set(data.map(x=>x.model))]
  .forEach(x=>model.add(new Option(x,x)));

  fillYears();

}


function fillYears(){

  const old=year.value;

  year.innerHTML='';

  [...new Set(
    data
    .filter(x=>x.model===model.value)
    .map(x=>x.year)
  )]
  .forEach(x=>year.add(new Option(x,x)));

  if([...year.options].some(o=>o.value===old)){
    year.value=old;
  }

  fillTrims();

}


function fillTrims(){

  const old=trim.value;

  trim.innerHTML='';

  data
  .filter(x=>
    x.model===model.value &&
    x.year===year.value
  )
  .forEach(x=>
    trim.add(new Option(x.trim,x.trim))
  );

  if([...trim.options].some(o=>o.value===old)){
    trim.value=old;
  }

  fillQuotes();

}


function quoteLabel(d,type){

  if(type==='base'){
    return '空車';
  }

  if(type==='pkg1'){
    return '空車＋'+d.cost1Name;
  }

  if(type==='pkg2'){
    return '空車＋'+d.cost1Name+'＋'+d.cost2Name;
  }

  if(type==='pkg2only'){
    return '空車＋'+d.cost2Name;
  }

  return '空車';

}


function fillQuotes(){

  const d=current();

  if(!d)return;

  const old=quote.value;

  quote.innerHTML='';

  d.quotes.forEach(q=>{
    quote.add(
      new Option(
        quoteLabel(d,q),
        q
      )
    );
  });

  if([...quote.options].some(o=>o.value===old)){
    quote.value=old;
  }

  render();

}


function render(){

  const d=current();

  if(!d)return;


  /* 無乙式加回減發金額 */

  const adjustment=
    ins.value==='無'
    ? d.noIns
    : 0;


/* =========================
   依報價方式，只顯示目前選擇的方案
========================= */

let displayName='';
let displayPrice=0;
let displayBonus=0;


/* 空車 */

if(quote.value==='base'){

  displayName='空車';

  displayPrice=d.price;

  displayBonus=d.base;

}


/* 空車＋精裝 */

if(quote.value==='pkg1'){

  displayName=
    '空車＋'+d.bonus1Name;

  let original1=0;

  if(d.model==='RAV4 HEV'){
    original1=70000;
  }

  if(d.model==='COROLLA CROSS'){
    original1=50000;
  }

  displayPrice=
    d.price+
    original1;

  displayBonus=
    d.base+
    (d.bonus1||0);

}


/* 空車＋精裝＋尊榮 / 影音 */

if(quote.value==='pkg2'){

  displayName=
    '空車＋'+
    d.bonus1Name+
    '＋'+
    d.bonus2Name;

  let original1=0;
  let original2=0;

  if(d.model==='RAV4 HEV'){
    original1=70000;
    original2=72000;
  }

  if(d.model==='COROLLA CROSS'){
    original1=50000;
    original2=80000;
  }

  displayPrice=
    d.price+
    original1+
    original2;

  displayBonus=
    d.base+
    (d.bonus1||0)+
    (d.bonus2||0);

}


/* 空車＋第二套件
   RAV4 = 尊榮
   CC = 影音
   PHEV = 尊榮套件
*/

if(quote.value==='pkg2only'){

  displayName=
    '空車＋'+d.bonus2Name;

  let original2=0;

  if(d.model==='RAV4 HEV'){
    original2=72000;
  }

  if(d.model==='COROLLA CROSS'){
    original2=80000;
  }

  displayPrice=
    d.price+
    original2;

  displayBonus=
    d.base+
    (d.bonus2||0);

}

/* 顯示 */

$('selectedPriceName').textContent=
  displayName+
  (quote.value==='base' ? '單價' : '原價');

$('selectedPrice').textContent=
  fmt(displayPrice);

$('selectedBonusName').textContent=
  displayName+'獎金';

$('selectedBonus').textContent=
  fmt(displayBonus);





  /* =========================
     成交／成本價計算
  ========================= */

  let amount=
    d.price-
    d.base+
    adjustment;


  if(quote.value==='pkg1'){
    amount+=d.cost1;
  }


  if(quote.value==='pkg2'){
    amount+=
      d.cost1+
      d.cost2;
  }


  if(quote.value==='pkg2only'){
    amount+=d.cost2;
  }


  /* 空車叫成交價
     有套件叫成本價 */

  let priceType='成交價';

  if(
    quote.value==='pkg1' ||
    quote.value==='pkg2' ||
    quote.value==='pkg2only'
  ){
    priceType='成本價';
  }


  $('dealName').textContent=
    quoteLabel(d,quote.value)+
    priceType;

  $('deal').textContent=
    fmt(amount);


  /* 備註 */

  $('noteText').textContent=d.note;

  $('note').classList.toggle(
    'hidden',
    d.note==='無'
  );

}


model.addEventListener(
  'change',
  fillYears
);

year.addEventListener(
  'change',
  fillTrims
);

trim.addEventListener(
  'change',
  fillQuotes
);

ins.addEventListener(
  'change',
  render
);

quote.addEventListener(
  'change',
  render
);


fillModels();
