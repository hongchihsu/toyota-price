<style>
*{box-sizing:border-box}

body{

}

.wrap{
  max-width:560px;
  margin:auto;
  padding:18px 14px 40px
}

.hero,.card{
  background:#fff;
  border-radius:20px;
  box-shadow:0 5px 24px #0000000d
}

.hero{
  padding:20px 18px;
  margin-bottom:14px
}

.brand{
  font-size:13px;
  font-weight:800;
  letter-spacing:1.4px;
  color:#d71920
}

.hero h1{
  font-size:26px;
  margin:5px 0 4px
}

.hero p{
  font-size:14px;
  color:#6e6e73;
  margin:0
}

.card{
  padding:16px;
  margin:12px 0
}

.field{
  margin:0 0 14px
}

.field:last-child{
  margin:0
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:#555
}

select{
  width:100%;
  font:inherit;
  font-size:17px;
  border:1px solid #d2d2d7;
  border-radius:12px;
  padding:12px 13px;
  background:#fff;
  color:#111
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:11px 2px;
  border-bottom:1px solid #eee
}

.row:last-child{
  border:0
}

.name{
  font-size:14px;
  color:#555
}

.value{
  font-size:17px;
  font-weight:700;
  text-align:right
}

.bonusHint{
  font-size:12px;
  color:#86868b;
  margin-top:7px;
  line-height:1.4
}

.deal{
  background:#1d1d1f;
  color:#fff
}

.deal .name{
  color:#d1d1d6
}

.deal .value{
  font-size:22px
}

.note{
  background:#fff7e6;
  border:1px solid #f2d19a;
  border-radius:14px;
  padding:13px 14px;
  margin-top:12px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-line;
}

.note b{
  display:block;
  margin-bottom:3px
}

.invoice{
  background:#eef6ff;
  border:1px solid #c9ddf5;
  border-radius:14px;
  padding:13px 14px;
  margin-top:12px;
  font-size:14px;
  line-height:1.5
}

.invoice b{
  display:block;
  margin-bottom:3px
}

.muted{
  font-size:12px;
  color:#86868b;
  text-align:center;
  margin-top:16px;
  line-height:1.5
}

.hidden{
  display:none!important
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <div class="brand">TOYOTA</div>
    <h1>全車系折讓查詢</h1>
    <p>選擇車型、年式與報價方式，自動計算成本價</p>
  </div>


  <div class="card">

    <div class="field">
      <label>車型</label>
      <select id="model"></select>
    </div>

    <div class="field">
      <label>年式</label>
      <select id="year"></select>
    </div>

    <div class="field">
      <label>版本</label>
      <select id="trim"></select>
    </div>

    <div class="field">
      <label>投保乙式</label>
      <select id="insurance">
        <option value="有">有</option>
        <option value="無">無</option>
      </select>
    </div>

    <div class="field">
      <label>報價方式</label>
      <select id="quote"></select>
    </div>

  </div>


  <div class="card">

    <div class="row">
      <span class="name" id="selectedPriceName"></span>
      <span class="value" id="selectedPrice"></span>
    </div>

    <div class="row">
      <span class="name" id="selectedBonusName"></span>
      <span class="value" id="selectedBonus"></span>
    </div>

    <div class="bonusHint hidden" id="bonusHint"></div>

  </div>


  <div class="card deal">
    <div class="row">
      <span class="name" id="dealName">成本價</span>
      <span class="value" id="deal"></span>
    </div>
  </div>


  <div class="note hidden" id="note">
    <b>備註</b>
    <span id="noteText"></span>
  </div>


  <div class="invoice hidden" id="invoice">
    <b>發票註記</b>
    <span id="invoiceText"></span>
  </div>


  <div class="muted">
    未投保乙式時，加回減發金額至成本價；獎金顯示不變;部分車型獎金另依專案規定。
  </div>

</div>

/*
==================================================
以下為共用計算程式
以後新增車型不用修改這裡
==================================================
*/

const $=id=>document.getElementById(id);

const fmt=n=>
  'NT$ '+Number(n).toLocaleString('zh-TW');

const model=$('model');
const year=$('year');
const trim=$('trim');
const ins=$('insurance');
const quote=$('quote');


function current(){

  return data.find(x=>
    x.model===model.value &&
    x.year===year.value &&
    x.trim===trim.value
  );

}


/*
產生所有可選報價組合

例如：
2個套件會自動產生
空車
空車＋套件1
空車＋套件2
空車＋套件1＋套件2
*/

function getQuoteOptions(d){

  const result=[
    {
      value:'base',
      packageIndexes:[],
      label:'空車'
    }
  ];

  const packages=d.packages||[];


  /*
  CROWN、bZ4X 這種套件完全互斥
  */

  if(d.exclusivePackages){

    packages.forEach((pkg,i)=>{

      result.push({
        value:'packages-'+i,
        packageIndexes:[i],
        label:'空車＋'+pkg.name
      });

    });

  }else{


    /*
    一般車型：
    自動產生所有套件組合
    */

    const total=
      Math.pow(2,packages.length);


    for(let mask=1;mask<total;mask++){

      const indexes=[];


      for(let i=0;i<packages.length;i++){

        if(mask & (1<<i)){

          indexes.push(i);

        }

      }


      /*
      ========================================
      standalone:true 特殊規則

      只要這個組合裡有 standalone 套件，
      就不能再跟其他套件一起出現。

      YARIS CROSS 的「全配套件（9萬）」
      就會因此只能單獨選。
      ========================================
      */

      const hasStandalone=
        indexes.some(i=>
          packages[i].standalone===true
        );


      if(
        hasStandalone &&
        indexes.length>1
      ){

        continue;

      }


      const names=
        indexes.map(i=>
          packages[i].name
        );


      result.push({

        value:
          'packages-'+
          indexes.join('-'),

        packageIndexes:
          indexes,

        label:
          '空車＋'+
          names.join('＋')

      });

    }

  }


  /*
  排序：
  空車
  ↓
  單一套件
  ↓
  多套件
  */

  result.sort((a,b)=>{

    if(
      a.packageIndexes.length !==
      b.packageIndexes.length
    ){

      return (
        a.packageIndexes.length -
        b.packageIndexes.length
      );

    }


    return (
      (a.packageIndexes[0] ?? -1) -
      (b.packageIndexes[0] ?? -1)
    );

  });


  return result;

}


function selectedQuote(d){


  return getQuoteOptions(d)
    .find(x=>x.value===quote.value)
    || getQuoteOptions(d)[0];

}


function fillModels(){

  const old=model.value;

  model.innerHTML='';

  const models=[
    ...new Set(
      data.map(x=>x.model)
    )
  ];

  /*
  自動 A → Z
  */

  models.sort((a,b)=>
    a.localeCompare(
      b,
      'en',
      {
        sensitivity:'base',
        numeric:true
      }
    )
  );

  models.forEach(x=>
    model.add(
      new Option(x,x)
    )
  );

  if(
    [...model.options]
    .some(o=>o.value===old)
  ){
    model.value=old;
  }

  fillYears();

}


function yearNumber(value){

  const parts=
    value
    .split('/')
    .map(Number);

  return (
    (parts[0]||0)*100+
    (parts[1]||0)
  );

}


function fillYears(){

  const old=year.value;

  year.innerHTML='';

  const years=[
    ...new Set(
      data
      .filter(x=>
        x.model===model.value
      )
      .map(x=>x.year)
    )
  ];

  /*
  年式新 → 舊
  例如 26/27 → 26/26
  */

  years.sort(
    (a,b)=>
      yearNumber(a)-
      yearNumber(b)
  );

  years.forEach(x=>
    year.add(
      new Option(x,x)
    )
  );

  if(
    [...year.options]
    .some(o=>o.value===old)
  ){
    year.value=old;
  }

  fillTrims();

}


function fillTrims(){

  const old=trim.value;

  trim.innerHTML='';

  data
  .filter(x=>
    x.model===model.value &&
    x.year===year.value
  )
  .forEach(x=>
    trim.add(
      new Option(
        x.trim,
        x.trim
      )
    )
  );

  if(
    [...trim.options]
    .some(o=>o.value===old)
  ){
    trim.value=old;
  }

  fillQuotes();

}


function fillQuotes(){

  const d=current();

  if(!d)return;

  const old=quote.value;

  quote.innerHTML='';

  getQuoteOptions(d)
  .forEach(q=>{

    quote.add(
      new Option(
        q.label,
        q.value
      )
    );

  });

  if(
    [...quote.options]
    .some(o=>o.value===old)
  ){
    quote.value=old;
  }

  render();

}


function render(){

  const d=current();

  if(!d)return;

  const q=
    selectedQuote(d);

  const packages=
    d.packages||[];

  /*
  ==========================
  原價
  ==========================
  */

  let displayPrice=
    d.price;

  q.packageIndexes
  .forEach(i=>{

    displayPrice+=
      packages[i].original||0;

  });


  /*
  ==========================
  獎金
  ==========================
  */

  let displayBonus=
    d.base;

  /*
  只有選「空車」時，
  才扣空車扣發獎金。
  */

  if(q.packageIndexes.length===0){

    displayBonus-=
      d.baseDeduct||0;

  }else{

    q.packageIndexes
    .forEach(i=>{

      displayBonus+=
        packages[i].bonus||0;

    });

  }


  /*
  ==========================
  顯示原價／單價
  ==========================
  */

  $('selectedPriceName').textContent=
    q.label+
    (
      q.packageIndexes.length===0
      ? '單價'
      : '原價'
    );

  $('selectedPrice').textContent=
    fmt(displayPrice);


  $('selectedBonusName').textContent=
    q.label+'獎金';

  const specialBonusTexts=
  q.packageIndexes
   .map(i=>packages[i].bonusText)
   .filter(Boolean);

if(specialBonusTexts.length>0){

  $('selectedBonus').textContent=
    specialBonusTexts.join('＋');

}else if(
  d.insuranceRequiredForBonus===true &&
  ins.value==='無'
){

  $('selectedBonus').textContent=
    fmt(0);

}else{

  $('selectedBonus').textContent=
    fmt(displayBonus);

}

  /*
  ==========================
  空車扣發提示
  ==========================
  */

  const hint=
    $('bonusHint');

  if(
    q.packageIndexes.length===0 &&
    (d.baseDeduct||0)>0
  ){

    hint.textContent=
      '※ 空車扣發獎金 '+
      fmt(d.baseDeduct);

    hint.classList.remove(
      'hidden'
    );

  }else{

    hint.classList.add(
      'hidden'
    );

  }


  /*
  ==========================
  成本價
  ==========================
  */

  let amount=
    d.price-
    d.base;


  /*
  空車才加回空車扣發
  */

  if(
    q.packageIndexes.length===0
  ){

    amount+=
      d.baseDeduct||0;

  }


  /*
  套件成本
  */

  q.packageIndexes
  .forEach(i=>{

    amount+=
      packages[i].cost||0;

  });


  /*
  未投保乙式
  加回減發金額
  */

  if(ins.value==='無'){

    amount+=
      d.noIns||0;

  }


  $('dealName').textContent=
    q.label+'成本價';

  $('deal').textContent=
    fmt(amount);


  /*
  ==========================
  備註
  ==========================
  */

  const notes=[];

/* 車型固定備註 */
if((d.note||'').trim()){
  notes.push(d.note.trim());
}

/* 只有選到有設定 note 的套件才顯示 */
q.packageIndexes.forEach(i=>{

  const packageNote=
    (packages[i].note||'').trim();

  if(packageNote){
    notes.push(packageNote);
  }

});

const noteText=
  notes.join('｜');

$('noteText').textContent=
  noteText;

$('note').classList.toggle(
  'hidden',
  !noteText
);

  /*
  ==========================
  發票註記
  ==========================
  */

  const invoiceText=
    (d.invoiceNote||'').trim();

  $('invoiceText').textContent=
    invoiceText;

  $('invoice').classList.toggle(
    'hidden',
    !invoiceText
  );

}


model.addEventListener(
  'change',
  fillYears
);

year.addEventListener(
  'change',
  fillTrims
);

trim.addEventListener(
  'change',
  fillQuotes
);

ins.addEventListener(
  'change',
  render
);

quote.addEventListener(
  'change',
  render
);


fillModels();

</script>

</body>
</html>
