<title>Toyota 折讓查詢</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f5f5f7;color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif
}
.wrap{max-width:560px;margin:auto;padding:18px 14px 40px}
.hero,.card{
  background:#fff;border-radius:20px;
  box-shadow:0 5px 24px #0000000d
}
.hero{padding:20px 18px;margin-bottom:14px}
.brand{font-size:13px;font-weight:800;letter-spacing:1.4px;color:#d71920}
.hero h1{font-size:26px;margin:5px 0 4px}
.hero p{font-size:14px;color:#6e6e73;margin:0}
.card{padding:16px;margin:12px 0}
.field{margin:0 0 14px}
.field:last-child{margin:0}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#555}
select{
  width:100%;font:inherit;font-size:17px;
  border:1px solid #d2d2d7;border-radius:12px;
  padding:12px 13px;background:#fff;color:#111
}
.row{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:11px 2px;border-bottom:1px solid #eee
}
.row:last-child{border:0}
.name{font-size:14px;color:#555}
.value{font-size:17px;font-weight:700;text-align:right}
.deal{background:#1d1d1f;color:#fff}
.deal .name{color:#d1d1d6}
.deal .value{font-size:22px}
.note{
  background:#fff7e6;border:1px solid #f2d19a;
  border-radius:14px;padding:13px 14px;margin-top:12px;
  font-size:14px;line-height:1.5
}
.note b{display:block;margin-bottom:3px}
.muted{font-size:12px;color:#86868b;text-align:center;margin-top:16px}
.hidden{display:none!important}
</style>
</head>

<div class="wrap">

<div class="hero">
  <div class="brand">TOYOTA</div>
  <h1>全車系折讓查詢</h1>
  <p>選擇車型、年式與報價方式，自動計算成交價</p>
</div>

<div class="card">

  <div class="field">
    <label>車型</label>
    <select id="model"></select>
  </div>

  <div class="field">
    <label>年式</label>
    <select id="year"></select>
  </div>

  <div class="field">
    <label>版本</label>
    <select id="trim"></select>
  </div>

  <div class="field">
    <label>投保乙式</label>
    <select id="insurance">
      <option value="有">有</option>
      <option value="無">無</option>
    </select>
  </div>

  <div class="field">
    <label>報價方式</label>
    <select id="quote"></select>
  </div>

</div>


<div class="card">

  <div class="row">
    <span class="name">空車單價</span>
    <span class="value" id="price"></span>
  </div>

  <div class="row">
    <span class="name">空車獎金</span>
    <span class="value" id="base"></span>
  </div>

  <div class="row" id="bonus1Row" style="display:none;">
    <span class="name" id="bonus1Name"></span>
    <span class="value" id="bonus1"></span>
  </div>

  <div class="row" id="bonus2Row" style="display:none;">
    <span class="name" id="bonus2Name"></span>
    <span class="value" id="bonus2"></span>
  </div>

  <div class="row">
    <span class="name">空車＋精裝＋尊榮獎金</span>
    <span class="value" id="total"></span>
  </div>

  <div class="row" id="cost1Row">
    <span class="name" id="cost1Name"></span>
    <span class="value" id="cost1"></span>
  </div>

  <div class="row" id="cost2Row">
    <span class="name" id="cost2Name"></span>
    <span class="value" id="cost2"></span>
  </div>

</div>


<div class="card deal">
  <div class="row">
    <span class="name" id="dealName">成交價</span>
    <span class="value" id="deal"></span>
  </div>
</div>


<div class="note" id="note">
  <b>備註</b>
  <span id="noteText"></span>
</div>

<div class="muted">
無投保乙式時，減發金額僅反映於成本價，不更動原折讓顯示。
</div>

</div>

const $=id=>document.getElementById(id);
const fmt=n=>'NT$ '+n.toLocaleString('zh-TW');

const model=$('model');
const year=$('year');
const trim=$('trim');
const ins=$('insurance');
const quote=$('quote');


function current(){

return data.find(x=>
x.model===model.value &&
x.year===year.value &&
x.trim===trim.value
);

}


function fillModels(){

model.innerHTML='';

[...new Set(data.map(x=>x.model))]
.forEach(x=>model.add(new Option(x,x)));

fillYears();

}


function fillYears(){

const old=year.value;

year.innerHTML='';

[...new Set(
data
.filter(x=>x.model===model.value)
.map(x=>x.year)
)]
.forEach(x=>year.add(new Option(x,x)));

if([...year.options].some(o=>o.value===old)){
year.value=old;
}

fillTrims();

}


function fillTrims(){

const old=trim.value;

trim.innerHTML='';

data
.filter(x=>
x.model===model.value &&
x.year===year.value
)
.forEach(x=>
trim.add(new Option(x.trim,x.trim))
);

if([...trim.options].some(o=>o.value===old)){
trim.value=old;
}

fillQuotes();

}


function quoteLabel(d,type){

if(type==='base'){
return '空車';
}

if(type==='pkg1'){
return '空車＋'+d.cost1Name;
}

if(type==='pkg2'){
return '空車＋'+d.cost1Name+'＋'+d.cost2Name;
}

if(type==='pkg2only'){
return '空車＋'+d.cost2Name;
}

return '空車';

}


function fillQuotes(){

const d=current();

if(!d)return;

const old=quote.value;

quote.innerHTML='';

d.quotes.forEach(q=>{
quote.add(
new Option(
quoteLabel(d,q),
q
)
);
});

if([...quote.options].some(o=>o.value===old)){
quote.value=old;
}

render();

}


function render(){

const d=current();

if(!d)return;


/* 無乙式減發
   RAV4 = 8000
   CC = 4000
   直接依各車型資料計算
*/

const adjustment=
ins.value==='無'
? d.noIns
: 0;


$('price').textContent=fmt(d.price);
$('base').textContent=fmt(d.base);


/* 獎金 */

$('bonus1Row')
.classList.toggle(
'hidden',
!d.bonus1Name
);

$('bonus2Row')
.classList.toggle(
'hidden',
!d.bonus2Name
);

$('bonus1Name').textContent=
(d.bonus1Name||'')+'折讓（獎金）';

$('bonus2Name').textContent=
(d.bonus2Name||'')+'折讓（獎金）';

$('bonus1').textContent=
fmt(d.bonus1||0);

$('bonus2').textContent=
fmt(d.bonus2||0);

$('total').textContent=
fmt(
d.base+
(d.bonus1||0)+
(d.bonus2||0)
);


/* 成本 */

$('cost1Row')
.classList.toggle(
'hidden',
!d.cost1Name
);

$('cost2Row')
.classList.toggle(
'hidden',
!d.cost2Name
);

$('cost1Name').textContent=
(d.cost1Name||'')+'成本';

$('cost2Name').textContent=
(d.cost2Name||'')+'成本';

$('cost1').textContent=
fmt(d.cost1||0);

$('cost2').textContent=
fmt(d.cost2||0);


/* 成交價 */

let amount=
d.price-
d.base+
adjustment;


if(quote.value==='pkg1'){

amount+=d.cost1;

}


if(quote.value==='pkg2'){

amount+=
d.cost1+
d.cost2;

}


if(quote.value==='pkg2only'){

amount+=d.cost2;

}


$('dealName').textContent=
quoteLabel(d,quote.value)+
'成交價';

$('deal').textContent=
fmt(amount);


/* 備註 */

$('noteText').textContent=d.note;

$('note')
.classList.toggle(
'hidden',
d.note==='無'
);

}


model.addEventListener(
'change',
fillYears
);

year.addEventListener(
'change',
fillTrims
);

trim.addEventListener(
'change',
fillQuotes
);

ins.addEventListener(
'change',
render
);

quote.addEventListener(
'change',
render
);


fillModels();
